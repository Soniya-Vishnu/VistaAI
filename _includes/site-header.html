<header class="site-header" id="site-header">
  <div class="site-header__top">

    <!-- Left: Logo + Title -->
    <div class="site-header__brand">
      <a href="{{ '/' | relative_url }}" class="site-header__brand-link">
        <img src="{{ '/assets/img/logo/UB_CVML_Group.png' | relative_url }}"
             alt="CVML Group Logo"
             class="site-header__logo">
        <span class="site-header__title">CVML GROUP</span>
      </a>
    </div>

    <!-- Right: Nav links (desktop) + Burger (mobile) -->
    <nav class="site-header__nav" id="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"
        {% if page.url == '/' %}class="site-header__nav--active"{% endif %}>Home</a>

      <a href="{{ '/presentphdstudents/' | relative_url }}"
        {% if page.url contains 'presentphdstudents' %}class="site-header__nav--active"{% endif %}>Present PhD Students</a>

      <a href="{{ '/alumni/' | relative_url }}"
        {% if page.url contains 'alumni' %}class="site-header__nav--active"{% endif %}>Alumni</a>

      <a href="{{ '/collaborators/' | relative_url }}"
        {% if page.url contains 'collaborators' %}class="site-header__nav--active"{% endif %}>Collaborators</a>

      <a href="{{ '/prospectivestudents/' | relative_url }}"
        {% if page.url contains 'prospectivestudents' %}class="site-header__nav--active"{% endif %}>Prospective Students</a>

      <a href="https://vlokhande-ub.github.io/"
         target="_blank" rel="noopener noreferrer">Principal Investigator</a>
    </nav>

    <!-- Hamburger (mobile only) -->
    <button class="site-header__burger"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="site-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>

<script>
(function () {
  var burger = document.querySelector('.site-header__burger');
  var nav    = document.getElementById('site-nav');
  var header = document.getElementById('site-header');
  if (!burger || !nav) return;

  burger.addEventListener('click', function () {
    var isOpen = nav.classList.toggle('is-open');
    burger.classList.toggle('is-open', isOpen);
    burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    header.classList.toggle('menu-open', isOpen);
  });

  nav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      nav.classList.remove('is-open');
      burger.classList.remove('is-open');
      burger.setAttribute('aria-expanded', 'false');
      header.classList.remove('menu-open');
    });
  });
})();
</script>
